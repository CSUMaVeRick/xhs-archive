<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>XHS 归档管理</title>
  <link rel="stylesheet" href="manage.css" />
</head>
<body>
  <header>
    <span class="logo">📕</span>
    <h1>小红书归档管理</h1>
    <span id="dir-status" class="dir-status">未选择目录</span>
    <button id="pick-dir" class="btn">选择归档目录</button>
  </header>

  <div id="tabs" class="tabs">
    <button id="tab-notes" class="tab active">笔记 <span id="count-notes" class="tab-num"></span></button>
    <button id="tab-authors" class="tab">作者 <span id="count-authors" class="tab-num"></span></button>
    <button id="tab-batches" class="tab">检索批次 <span id="count-batches" class="tab-num"></span></button>
  </div>

  <!-- ================= 笔记视图 ================= -->
  <div id="notes-view">
    <div id="toolbar" class="toolbar">
      <input id="search" class="search" type="text" placeholder="搜索标题 / 标签 / 作者 / 关键词 / 标注备注..." />
      <select id="filter-label" class="select">
        <option value="">全部标签</option>
      </select>
      <label class="chk"><input id="hide-excluded" type="checkbox" /> 隐藏已排除</label>
      <label class="chk"><input id="only-unannotated" type="checkbox" /> 只看未标注</label>
      <span id="count" class="count"></span>
    </div>

    <div id="batch" class="batch">
      <button id="select-all" class="btn-mini">全选当前</button>
      <button id="select-none" class="btn-mini">清除选择</button>
      <span id="sel-count" class="count">已选 0 篇</span>
      <span class="sep"></span>
      <input id="batch-label" class="mini-input" type="text" list="label-list" placeholder="标签名" />
      <button id="batch-label-add" class="btn-mini">批量加标签</button>
      <button id="batch-label-remove" class="btn-mini">批量去标签</button>
      <span class="sep"></span>
      <select id="batch-sort" class="mini-input"></select>
      <button id="batch-sort-apply" class="btn-mini">批量设排序</button>
      <span class="sep"></span>
      <button id="batch-exclude" class="btn-mini">批量排除</button>
      <button id="batch-include" class="btn-mini">取消排除</button>
      <span class="sep"></span>
      <button id="export-csv" class="btn-mini">导出笔记 CSV</button>
      <button id="export-jsonl" class="btn-mini">导出 JSONL</button>
      <button id="export-authors" class="btn-mini">导出作者 CSV</button>
      <span id="anno-status" class="count"></span>
    </div>
    <datalist id="label-list"></datalist>

    <div id="list" class="list"></div>
    <div id="empty" class="empty" style="display:none">请选择归档目录开始浏览</div>
  </div>

  <!-- ================= 作者视图 ================= -->
  <div id="authors-view" hidden>
    <div class="toolbar">
      <input id="author-search" class="search" type="text" placeholder="搜索昵称 / 小红书号 / 简介 / 属地..." />
      <select id="author-sort" class="select">
        <option value="fans">按粉丝数（多→少）</option>
        <option value="notes">按归档笔记数（多→少）</option>
        <option value="recent">按最近观测（新→旧）</option>
        <option value="archived">按首次归档（新→旧）</option>
        <option value="nickname">按昵称</option>
      </select>
      <label class="chk"><input id="author-only-with-notes" type="checkbox" /> 只看有归档笔记的作者</label>
      <span id="author-count" class="count"></span>
    </div>
    <div id="author-list" class="author-list"></div>
    <div id="author-empty" class="empty" style="display:none">还没有作者记录 —— 在笔记页点面板的「保存作者」即可</div>
  </div>

  <!-- ================= 检索批次视图 ================= -->
  <div id="batches-view" hidden>
    <div class="toolbar">
      <button id="batch-reload" class="btn-mini">重新读取</button>
      <span id="count-batch" class="count"></span>
      <span id="batch-status" class="count"></span>
    </div>

    <div id="batch-list" class="batch-list"></div>
    <div id="batch-empty" class="empty" style="display:none">还没有检索批次 —— 在搜索结果页用弹窗的「开始采集」采一批，文件会落在归档目录的 searches 里</div>

    <div id="batch-detail" hidden>
      <div class="toolbar">
        <button id="batch-back" class="btn-mini">← 返回批次列表</button>
        <span id="batch-detail-title" class="count"></span>
        <span class="sep"></span>
        <button id="batch-select-all" class="btn-mini">全选</button>
        <button id="batch-select-none" class="btn-mini">全不选</button>
        <span id="batch-sel-count" class="count">已勾选 0 篇</span>
        <span class="sep"></span>
        <button id="batch-export-jsonl" class="btn-mini">导出勾选 JSONL</button>
        <button id="batch-export-csv" class="btn-mini">导出勾选 CSV</button>
      </div>
      <div id="batch-cards" class="batch-cards"></div>
    </div>
  </div>

  <!-- 预览 / 标注抽屉 -->
  <div id="preview" class="preview" hidden>
    <button id="close-preview" class="close">×</button>
    <div id="preview-content"></div>
  </div>

  <script src="content/schema.js"></script>
  <script src="manage.js"></script>
</body>
</html>
